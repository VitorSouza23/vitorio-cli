# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  pull_request:
    branches: ["master"]
    types:
      - closed
  workflow_dispatch: # To publish not released versions

jobs:
  build-and-publish:
    env:
      PROJECT_PATH: ./Application/Vitorio.CLI/Vitorio.CLI.csproj

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Pack
        run: dotnet pack ${{ env.PROJECT_PATH }} --no-restore -o out

        # Get a short-lived NuGet API key
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish
        run: dotnet nuget push out/*.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source ${{ secrets.NUGET_SERVER }} --skip-duplicate
